description: >-
  Industry-vertical index of APIs, data sources, syndication networks, and
  product information management (PIM) platforms that power the consumer
  packaged goods (CPG) and consumer products ecosystem. Catalogs corporate
  developer surfaces from large CPG manufacturers (P&G, Unilever, Nestle,
  Coca-Cola, PepsiCo, Mondelez, Kimberly-Clark, Colgate-Palmolive),
  product-identifier registries (GS1 Digital Link, GTIN/UPC lookup),
  open product databases (Open Food Facts, Open Beauty Facts),
  commercial syndication networks (Salsify, Syndigo, 1WorldSync), and
  PIM platforms (Akeneo, Pimcore, Plytix, Sales Layer).
