- type: Features
  data:
  - name: Global Product Identification
    description: >-
      GS1-issued GTIN, UPC, EAN, and ISBN identifiers, increasingly carried
      in GS1 Digital Link URIs and 2D barcodes for omnichannel resolution.
  - name: Master Data Syndication
    description: >-
      Centralized publishing of product master data through GDSN data pools
      (1WorldSync, Syndigo) so retailers receive consistent, validated
      attributes across regions.
  - name: Product Information Management
    description: >-
      PIM platforms (Akeneo, Pimcore, Plytix, Sales Layer, Salsify) that
      model attribute families, variants, channels, locales, and assets for
      omnichannel commerce.
  - name: Nutrition And Ingredient Transparency
    description: >-
      Open and commercial APIs surfacing ingredients, allergens, nutrition
      facts, Nutri-Score, NOVA classification, and additive data for food
      and beverage products.
  - name: Cosmetic And Personal Care Transparency
    description: >-
      INCI ingredient lists, allergen flags, and packaging data for beauty
      and personal care products, exposed through Open Beauty Facts and
      retailer feeds.
  - name: Digital Shelf Analytics
    description: >-
      Monitoring product content quality, search rank, ratings, reviews,
      pricing, and availability across retailer e-commerce sites and
      marketplaces.
- type: UseCases
  data:
  - name: Product Onboarding To Retailers
    description: >-
      Brands publish master data once into a GDSN data pool and syndicate
      to grocery, drug, mass, and club retailers with channel-specific
      validation.
  - name: Connected Packaging With 2D Barcodes
    description: >-
      Replacing 1D UPC barcodes with GS1 Digital Link QR codes to expose
      brand experiences, regulatory data, supply chain provenance, and
      recycling guidance from a single scan.
  - name: Ingredient And Allergen Lookup
    description: >-
      Consumer apps querying Open Food Facts or Open Beauty Facts by
      barcode to surface allergens, additives, certifications, and
      nutritional scoring.
  - name: PIM-Driven Marketplace Distribution
    description: >-
      Mid-market brands using PIM platforms to push consistent catalogs to
      Amazon, Walmart, Target Plus, Shopify, and direct-to-consumer
      channels.
  - name: Regulatory Reporting And Recall Management
    description: >-
      Tracing recalled lots, batch codes, and serialized units through GS1
      identifiers and supply chain APIs to support food safety, FDA,
      USDA, and EU recall workflows.
- type: Integrations
  data:
  - name: GS1 Global Data Synchronization Network (GDSN)
    description: >-
      The international network of certified data pools enabling brands and
      retailers to synchronize standardized product master data globally.
  - name: Schema.org Product
    description: >-
      The web vocabulary used for embedding product, offer, and review
      markup in e-commerce pages and consumed by search engines and
      shopping platforms.
  - name: Amazon Selling Partner API
    description: >-
      Marketplace API consumed by PIM platforms (Salsify, Plytix, Sales
      Layer) to push catalogs, manage listings, and read orders.
  - name: Shopify Admin API
    description: >-
      DTC commerce API integrated by brands and PIM platforms for product,
      inventory, and order synchronization.
  - name: SAP S/4HANA And Oracle NetSuite
    description: >-
      Enterprise resource planning systems where master product data
      originates and is published outward through PIM and syndication
      layers.
