apis:
- name: GS1 Digital Link
  description: >-
    GS1 Digital Link is the global standard that turns GS1 identifiers
    (GTINs, SSCCs, GLNs) into web URIs so a single barcode or QR code can
    connect to multiple sources of brand, regulatory, supply chain, and
    consumer information. It is the cornerstone identification standard for
    consumer products and underpins GS1 2D Sunrise 2027.
  humanURL: https://www.gs1.org/standards/gs1-digital-link
  baseURL: https://ref.gs1.org/standards/digital-link/
  tags:
  - GS1
  - Digital Link
  - GTIN
  - 2D Barcode
  - Identification
  properties:
  - type: Documentation
    url: https://www.gs1.org/standards/gs1-digital-link
  - type: Specification
    url: https://ref.gs1.org/standards/digital-link/uri-syntax/
    title: GS1 Digital Link URI Syntax 1.4
  - type: Specification
    url: https://ref.gs1.org/standards/resolver/
    title: GS1 Digital Link Resolver Standard 1.3
